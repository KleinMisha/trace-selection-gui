pages:
  image: python:3.12
  stage: build_docs_site
  script:
    - pip install mkdocs mkdocs-material
    - mkdocs build 
    - mv site public 
    - mkdir -p public/coverage/
    - cp -r htmlcov/* public/coverage/
  artifacts:
    paths:
      - public
  needs: 
    - pytest 
  only:
    - feature/ci-gitlab 

  


