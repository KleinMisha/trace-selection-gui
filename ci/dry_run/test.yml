pytest:
  image: python:3.12-slim
  stage: test
  before_script:
    - apt-get update && apt-get install -y git curl --no-install-recommends
    - apt-get update && apt-get install -y --no-install-recommends \
      libharfbuzz0b \
      libsm6 \
      libpng16-16 \
      libxcb-render0 \
      libxcb-render-util0 \
      libxcb-shm0 \
      libxcb-glx0 \
      libxcb-randr0 \
      libxcb-keysyms1 \
      libxcb-xkb1 \
      libxcb-xinput0 \
      libxcb-icccm4 \
      libxcb-image0 \
      libxcb-shape0 \
      libxcb-xfixes0 \
      libdrm2 \
      libfreetype6 \
      libx11-6 \
      libxkbcommon-x11-0 \
      libdbus-1-3 \
      libice6 \
      libinput10 \
      libfontconfig1 \
      libjpeg62-turbo \
      libatomic1 \
      libgbm1 \
      libproxy1v5 \
      libts0 \
      libopengl0 \
      libegl1 \
      libdouble-conversion3 \
      libicu76 \
      libmtdev1 \
      libglib2.0-0 \
      shared-mime-info \
      libcups2 \
      libpcre2-16-0 \
      libbrotli1 \
      libglx0 \
      libmd4c0
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync
    - uv run pytest --cov --cov-report=term --cov-report=html --cov-report=xml -v --junitxml=test-results.xml
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    paths:
      - test-results.xml
      - htmlcov/           # HTML coverage report for human-readable view
    expire_in: 1 week
  coverage: '/TOTAL.*?(\d+\.\d+%|\d+%)/'
  only:
    - feature/ci-gitlab



