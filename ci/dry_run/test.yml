pytest:
  image: python:3.12-slim
  stage: test
  before_script:
    - apt-get update && apt-get install -y \
        git curl libgl1 libglib2.0-0 libx11-6 libxkbcommon0 libxrender1 libxext6 libxrandr2 \
        libfreetype6 fontconfig libasound2    
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync
    - uv run pytest --cov --cov-report=term --cov-report=html --cov-report=xml -v --junitxml=test-results.xml
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    paths:
      - test-results.xml
      - htmlcov/           # HTML coverage report for human-readable view
    expire_in: 1 week
  coverage: '/TOTAL.*?(\d+\.\d+%|\d+%)/'
  only:
    - feature/ci-gitlab



