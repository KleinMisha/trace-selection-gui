pytest:
  image: python:3.12-slim
  stage: test
  before_script:
    - apt-get update && apt-get install -y git curl --no-install-recommends
    - apt-get update && apt-get install -y --no-install-recommends \
      libc6 libgcc-s1 libstdc++6 zlib1g \
      fontconfig libfreetype6 libglib2.0-0 libdrm2 libegl1 libgl1 libopengl0 \
      libx11-6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 \
      libxrender1 libxext6 libxrandr2 libice6 libsm6 libxcb-cursor0 \
      libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
      libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
      libxcb-sync1 libxcb-xfixes0 libxcb-xinput0 libxcb-xkb1 libts0 \
      libudev1 libharfbuzz0b libjpeg62-turbo libpng16-16 libfontconfig1 \
      --no-install-recommends
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync
    - uv run pytest --cov --cov-report=term --cov-report=html --cov-report=xml -v --junitxml=test-results.xml
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    paths:
      - test-results.xml
      - htmlcov/           # HTML coverage report for human-readable view
    expire_in: 1 week
  coverage: '/TOTAL.*?(\d+\.\d+%|\d+%)/'
  only:
    - feature/ci-gitlab



