name: CI Pipeline

on:
    push:
        branches: [public-repo-misha]
    pull_request:
        branches: [public-repo-misha]

jobs:
    test:
        name: Pytest (incl. PyQt6 Tests)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install system Qt dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                  qt6-base-dev \
                  qt6-base-dev-tools \
                  libg11 \
                  libxcommon-x11-0 \
                  libxcb-cursor0 \
                  xvfb

            - name: Install UV
              run: curl -LsSf https://astral.sh/uv/install.sh | sh

            - name: Add UV to PATH
              run: echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Install Python dependencies
              run: uv sync

            - name: Run PyTest (with Qt-bot / headless)
              env:
                  QT_QPA_PLATFORM: offscreen
              run: |
                  uv run pytest \
                  --cov \
                  --cov-report=term \
                  --cov-report=xml \
                  --cov-report=html \
                  --junitxml=test-results.xml \
                  -v

            - name: Upload test artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: test-artifacts
                  path: |
                      test-results.xml
                      htmlcov/
                  retention-days: 7

    build_docs:
        name: Build Documentation and Deploy to Github Pages
        runs-on: ubuntu-latest
        needs: test
        if: github.ref == 'refs/heads/public-repo-misha'
        permissions:
            contents: read
            pages: write
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install MkDocs
              run: pip install mkdocs mkdocs-material

            - name: Build documentation
              run: mkdocs build

            - name: Download coverage artifact
              uses: actions/download-artifact@v4
              with:
                  name: test-artifacts
                  path: artifacts

            - name: Add coverage report to site
              run: |
                  mkdir -p site/coverage
                  cp -r articats/htmlcov/* site/coverage || true

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site

            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v4
